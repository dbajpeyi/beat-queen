name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests (no JUCE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-core -DBEATQUEEN_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-core --parallel
      - name: Test
        run: ctest --test-dir build-core --output-on-failure
      - name: Render instruments and rhythms
        run: |
          mkdir -p renders
          ./build-core/beatqueen_render renders 48000 120
      - uses: actions/upload-artifact@v4
        with:
          name: beat-queen-renders
          path: renders/*.wav

  plugin:
    name: Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: beat-queen-${{ runner.os }}
          path: |
            build/BeatQueen_artefacts/Release/VST3
            build/BeatQueen_artefacts/Release/Standalone
            build/BeatQueen_artefacts/Release/AU
          if-no-files-found: error
